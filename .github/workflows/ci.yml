name: CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.sh'
      - plugin.toml
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
    paths:
      - '**/*.sh'
      - plugin.toml
      - .github/workflows/ci.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    # ubuntu-latest: apt-installs shellcheck; PUBLIC repo uses GitHub-hosted only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint all shell scripts
        run: shellcheck *.sh
